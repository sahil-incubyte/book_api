# Development environment: Rails API + PostgreSQL.
#
# Usage:
#   cp .env.example .env     # first time only
#   docker compose up --build
#
# Services talk to each other over the default Compose network by service name,
# so Rails reaches Postgres at host "db" (see DATABASE_HOST in .env).

services:
  db:
    image: postgres:16-alpine
    # Values come from .env so the same names are used by Rails' database.yml.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Named volume -> database survives `docker compose down` / rebuilds.
      - pg_data:/var/lib/postgresql/data
    ports:
      # Exposed so you can connect with a local GUI/psql if you want.
      - "5432:5432"
    healthcheck:
      # web waits until Postgres actually accepts connections, not just boots.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Persist to disk with append-only file so cached data survives restarts.
    command: redis-server --appendonly yes
    volumes:
      # Named volume -> Redis data survives `docker compose down` / rebuilds.
      - redis_data:/data
    ports:
      # Exposed so you can poke at it with redis-cli from the host if you want.
      - "6379:6379"
    healthcheck:
      # web waits until Redis actually responds to PING, not just boots.
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.13.4
    environment:
      # Single-node cluster: no peer discovery, no replica shards needed.
      discovery.type: single-node
      # Dev only — turn off TLS/auth so Rails can talk plain HTTP on :9200.
      # NEVER do this in production.
      xpack.security.enabled: "false"
      # Cap the JVM heap so ES doesn't try to grab half the host's RAM.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      # Named volume -> index data survives `docker compose down` / rebuilds.
      - es_data:/usr/share/elasticsearch/data
    ports:
      # Exposed on 9202 (not the default 9200) so this dev cluster never clashes
      # with any other Elasticsearch/OpenSearch already bound to 9200 on the host.
      # Inside the Compose network services still reach it at elasticsearch:9200.
      - "9202:9200"
    healthcheck:
      # web waits until the cluster answers, not just until the JVM boots.
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Load all POSTGRES_* / RAILS_* variables from .env.
    env_file: .env
    volumes:
      # Bind mount: local source is live inside the container (edit -> reload).
      - .:/rails
      # Named volume: keep installed gems out of the bind mount so they persist
      # and aren't shadowed by the host directory.
      - bundle_cache:/usr/local/bundle
    ports:
      # Host port is configurable (set WEB_PORT to avoid clashes); container is 3000.
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    # Prepare the DB (create + migrate) on every boot, then start Puma.
    command: >
      bash -c "rm -f tmp/pids/server.pid &&
               bundle exec rails db:prepare &&
               bundle exec rails server -b 0.0.0.0 -p 3000"

volumes:
  pg_data:
  bundle_cache:
  redis_data:
  es_data:
