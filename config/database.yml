# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# Configure using the Gemfile:
#   gem "pg"
#
# Connection values are read from the environment so the same config works
# on your host, in Docker, and in CI. Sensible localhost defaults are provided
# for development so `bin/rails` still works without Docker.
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "postgres") %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "book_api_development") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_TEST_DB", "book_api_test") %>

# In production, provide connection values via the environment. You can also
# provide a single DATABASE_URL and Rails will merge it on top of these values.
production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "book_api_production") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { nil } %>
