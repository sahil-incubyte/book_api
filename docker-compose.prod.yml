# Production-like environment: uses the slim multi-stage `Dockerfile`.
#
# Usage:
#   cp .env.production.example .env.production   # fill in real secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.production up --build -d
#
# Differences from the dev compose file:
#   - builds the optimized production image (no dev/test gems, non-root user)
#   - NO source bind mount (code is baked into the image)
#   - Postgres is NOT exposed to the host (reachable only on the internal network)
#   - services restart automatically

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data_prod:/data
    # Not exposed to the host: reachable only on the internal Compose network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RAILS_ENV: production
      # Decrypts config/credentials.yml.enc. Provide via .env.production.
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      # Connection details (database.yml reads these).
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Rails cache store connects here (see config/environments/production.rb).
      REDIS_URL: redis://redis:6379/0
      # Serve static files and log to STDOUT inside a container.
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # bin/docker-entrypoint runs `db:prepare` before starting the server.
    restart: unless-stopped

volumes:
  pg_data_prod:
  redis_data_prod:
